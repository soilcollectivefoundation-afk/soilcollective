<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 — SOIL Collective Foundation</title>

    <!-- Main website stylesheet -->
    <link rel="stylesheet" href="dropdown1.css">

    <style>

        /* =========================================
           404 PAGE
        ========================================= */

       body {
    padding-top: 100px;
}

        .error-page {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 80px 30px;
        }

        .error-number {
            font-size: clamp(6rem, 18vw, 15rem);
            line-height: 0.8;
            font-weight: 400;
            letter-spacing: -0.06em;
            margin: 0 0 50px 0;
        }

        .error-page h1 {
            font-size: 1.1rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin: 0 0 20px 0;
        }

        .error-page p {
            font-size: 1rem;
            line-height: 1.6;
            margin: 0 0 35px 0;
        }

        .error-home {
            font-size: 1rem;
            text-decoration: underline;
            text-underline-offset: 4px;
            transition: opacity 0.2s ease;
        }

        .error-home:hover {
            opacity: 0.5;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            body {
                padding-top: 70px;
            }

            .error-page {
                min-height: 70vh;
                padding: 60px 20px;
            }

            .error-number {
                margin-bottom: 40px;
            }

            .error-page h1 {
                font-size: 0.95rem;
            }

            .error-page p {
                font-size: 0.95rem;
                max-width: 280px;
            }

            .error-home {
                font-size: 0.95rem;
            }

        }

    </style>

</head>


<body>

    <!-- =========================================
         404 CONTENT
    ========================================= -->

    <main class="error-page">

        <div class="error-number">
            404
        </div>

        <h1>
            Page Not Found
        </h1>

        <p>
            This page does not exist...
        </p>

        <a href="https://www.soilcollective.org/" class="error-home">
            ← Return to SOIL Collective
        </a>

    </main>

</body>

</html>
